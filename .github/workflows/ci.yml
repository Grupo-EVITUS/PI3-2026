name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} + MongoDB 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017
      SAA_REQUIRE_MONGO: "1"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }} com ext-mongodb
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mongodb, mbstring, openssl, curl
          tools: composer:v2
          coverage: none

      - name: Conferir versões
        run: |
          php -v
          php --ri mongodb | head -n 5

      - name: Validar composer.json
        run: composer validate --no-check-publish

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint de todos os arquivos PHP
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Políticas do front-end (CSP sem inline e sem recursos externos)
        run: |
          if grep -rn 'style="' views/; then
            echo "::error::Há estilo inline nas views (a CSP só permite arquivos CSS)."; exit 1
          fi
          if grep -rnP '<script(?![^>]*\ssrc=)|\son[a-z]+\s*=' views/; then
            echo "::error::Há script ou manipulador de evento inline nas views."; exit 1
          fi
          if grep -rnE 'https?://' views/ public/assets/css public/assets/js | grep -v 'www.w3.org'; then
            echo "::error::Há referência a recurso externo (o SAA não usa CDN)."; exit 1
          fi

      - name: Testes (unitários, integração com MongoDB e aceitação HTTP)
        run: vendor/bin/phpunit --do-not-cache-result

  docker:
    name: Docker Compose (MongoDB + aplicação + fila)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      INITIAL_USER_PASSWORD: "SenhaDoCI-2026!"
      EMAIL_WEBHOOK_SECRET: "segredo-somente-do-ci"

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar o docker-compose.yml
        run: docker compose config --quiet

      - name: Construir e subir os containers
        run: |
          set +e
          docker compose up -d --build > compose-up.log 2>&1
          code=$?
          tail -n 40 compose-up.log
          if [ "$code" -ne 0 ]; then
            msg=$(tail -n 25 compose-up.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=docker compose up::${msg}"
            exit "$code"
          fi

      - name: Saúde da aplicação e conexão com o MongoDB
        run: |
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS http://localhost:8080/health); then
              echo "$body"
              echo "$body" | grep -q '"mongo":true' && exit 0
            fi
            sleep 3
          done
          echo "::error title=health::A aplicação não respondeu /health com o MongoDB conectado em 3 minutos."
          exit 1

      - name: Fila de e-mails rodando (worker estável, sem reinícios)
        run: |
          sleep 15
          state=$(docker inspect -f '{{.State.Status}} running={{.State.Running}} restarts={{.RestartCount}} exit={{.State.ExitCode}}' saa-worker-1)
          echo "$state"
          case "$state" in
            "running running=true restarts=0 "*) ;;
            *) echo "::error title=worker::Estado inesperado da fila de e-mails: ${state}"; exit 1 ;;
          esac

      - name: Tela de login servida pelo container
        run: curl -fsS http://localhost:8080/login | grep -q 'name="csrf_token"'

      - name: Criar usuário dentro do container
        run: |
          docker compose exec -T -e INITIAL_USER_PASSWORD="$INITIAL_USER_PASSWORD" app \
            php bin/create_user.php --name "Admin CI" --email admin@ci.local --profile ADMIN

      - name: Dados persistem após reiniciar os containers (RNF-13)
        run: |
          docker compose restart
          for attempt in $(seq 1 60); do curl -fsS http://localhost:8080/health > /dev/null && break; sleep 3; done
          if out=$(docker compose exec -T -e INITIAL_USER_PASSWORD="$INITIAL_USER_PASSWORD" app \
                php bin/create_user.php --name "Admin CI" --email admin@ci.local --profile ADMIN 2>&1); then
            echo "::error::O usuário pôde ser criado de novo: os dados não persistiram."; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "Já existe"

      - name: Logs dos containers
        if: always()
        run: docker compose logs --no-color --tail=150

      # Os logs do job só são visíveis para administradores do repositório; em caso de falha, o diagnóstico
      # também vira anotação (visível para quem acompanha o PR/commit e pela API pública de check-runs).
      - name: Diagnóstico em anotações (somente se falhar)
        if: failure()
        run: |
          annotate() {
            local title="$1"; shift
            local msg
            msg=$("$@" 2>&1 | tail -n 40 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
            echo "::error title=${title}::${msg}"
          }
          annotate "docker compose ps" docker compose ps -a
          annotate "estado dos containers" docker inspect -f '{{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}-{{end}} error={{.State.Error}}' saa-mongo-1 saa-app-1 saa-worker-1
          for service in mongo app worker; do
            annotate "logs: ${service}" docker compose logs --no-color --tail=40 "${service}"
          done

      - name: Derrubar e apagar volumes
        if: always()
        run: docker compose down -v
