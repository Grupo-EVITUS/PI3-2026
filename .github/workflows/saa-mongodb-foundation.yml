name: SAA MongoDB foundation

on:
  push:
    branches:
      - feat/saa-mongodb-complete-attendance
      - feat/saa-mongodb-bootstrap-health
      - feat/saa-mongodb-auth
      - feat/saa-mongodb-user-audit
      - feat/saa-mongodb-replica-set
  pull_request:
    branches:
      - main

jobs:
  mongodb-foundation:
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB: saa_ci
      MONGODB_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP and MongoDB extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mongodb-2.5.0, mbstring
          tools: composer:v2
          coverage: none
      - name: Start MongoDB 7 replica set
        run: |
          docker run -d --name saa-mongodb -p 127.0.0.1:27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok')" = "1" ]; then break; fi
            sleep 1
          done
          if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok')" != "1" ]; then exit 1; fi
          docker exec saa-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ hello: 1 }).isWritablePrimary')" = "true" ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run BSON checks
        run: composer test:bson
      - name: Check real MongoDB connection and round trip
        run: php tests/Integration/Database/MongoSmokeTest.php
      - name: Lint MongoDB schema and bootstrap
        run: |
          php -l src/Database/Schema.php
          php -l src/Database/InitialAdmin.php
          php -l src/Database/HealthCheck.php
          php -l src/Database/MongoUserAuthenticator.php
          php -l src/Database/MongoOperationLogWriter.php
          php -l tests/Integration/Database/MongoTransactionTest.php
          php -l bin/init_mongodb.php
          php -l bin/create_initial_admin_mongodb.php
          php -l bin/healthcheck_mongodb.php
          php -l tests/Integration/Database/MongoSchemaTest.php
          php -l tests/Integration/Database/MongoAdminHealthTest.php
          php -l tests/Integration/Database/MongoUserAuthenticatorTest.php
          php -l tests/Integration/Database/MongoOperationLogWriterTest.php
      - name: Validate schema, indexes and idempotent bootstrap
        run: php tests/Integration/Database/MongoSchemaTest.php
      - name: Validate initial administrator and readiness check
        run: php tests/Integration/Database/MongoAdminHealthTest.php
      - name: Validate isolated MongoDB authentication
        run: php tests/Integration/Database/MongoUserAuthenticatorTest.php
      - name: Validate append-only MongoDB audit logging
        run: php tests/Integration/Database/MongoOperationLogWriterTest.php
      - name: Validate transaction commit and rollback
        run: php tests/Integration/Database/MongoTransactionTest.php
      - name: Validate login and staff registration over HTTP
        env:
          SAA_WEB_MODE: mongo_staff
          MONGODB_DB: saa_web_ci
          INITIAL_ADMIN_NAME: Coordenação
          INITIAL_ADMIN_EMAIL: coord@example.org
          INITIAL_ADMIN_PASSWORD: CI-temporaria-2026
        run: |
          php bin/init_mongodb.php
          php bin/create_initial_admin_mongodb.php
          php -S 127.0.0.1:8765 router.php > /tmp/saa-web-ci.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/login > /dev/null
          python3 tests/Integration/staff_web.py
          php -r 'require "vendor/autoload.php"; $db=Saa\Database\Mongo::database(); $u=$db->users->findOne(["email"=>"aoe@example.org"]); $a=$db->users->findOne(["email"=>"coord@example.org"]); exit($u && $a && $db->operation_logs->countDocuments(["action"=>"USUARIO_CRIADO","user_id"=>$a["_id"],"entity_id"=>(string)$u["_id"]])===1 && !$db->users->findOne(["email"=>"denied@example.org"]) ? 0 : 1);'
      - name: Stop MongoDB replica set
        if: always()
        run: docker rm -f saa-mongodb || true
