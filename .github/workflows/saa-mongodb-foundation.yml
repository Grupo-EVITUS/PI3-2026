name: SAA MongoDB foundation

on:
  push:
    branches:
      - feat/saa-mongodb-complete-attendance
      - feat/saa-mongodb-bootstrap-health
      - feat/saa-mongodb-auth
      - feat/saa-mongodb-user-audit
      - feat/saa-mongodb-replica-set
      - feat/saa-mongodb-school-directory
  pull_request:
    branches:
      - main

jobs:
  mongodb-foundation:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
      MONGODB_DB: saa_ci
      MONGODB_TIMEOUT_MS: 5000
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP and MongoDB extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mongodb-2.5.0, mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Start MongoDB 7 replica set
        run: |
          docker run -d --name saa-mongodb -p 127.0.0.1:27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok')" = "1" ]; then break; fi
            sleep 1
          done
          if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok')" != "1" ]; then exit 1; fi
          docker exec saa-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if [ "$(docker exec saa-mongodb mongosh --quiet --eval 'db.adminCommand({ hello: 1 }).isWritablePrimary')" = "true" ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Validate Composer metadata
        run: composer validate --no-check-publish
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run BSON checks
        run: composer test:bson
      - name: Check real MongoDB connection and round trip
        run: php tests/Integration/Database/MongoSmokeTest.php
      - name: Lint MongoDB schema and bootstrap
        run: |
          php -l src/Database/Schema.php
          php -l src/Migration/SQLiteImporter.php
          php -l src/Migration/SQLiteSnapshot.php
          php -l bin/import_sqlite_mongodb.php
          php -l tests/Integration/Database/SQLiteImporterTest.php
          php -l src/Database/InitialAdmin.php
          php -l src/Database/HealthCheck.php
          php -l src/Database/MongoUserAuthenticator.php
          php -l src/Database/MongoOperationLogWriter.php
          php -l src/Database/MongoSchoolDirectory.php
          php -l src/Database/MongoAttendance.php
          php -l src/Database/MongoJustification.php
          php -l src/Database/MongoMailQueue.php
          php -l bin/process_mail_queue_mongodb.php
          php -l src/mongo_staff_web.php
          php -l src/Helpers.php
          php -l templates/staff_registration.php
          php -l templates/school_directory.php
          php -l templates/mongo_attendance.php
          php -l templates/mongo_attendance_result.php
          php -l tests/Integration/Database/MongoSchoolDirectoryTest.php
          php -l tests/Integration/Database/MongoAttendanceTest.php
          php -l tests/Integration/Database/MongoMailQueueTest.php
          php -l tests/Integration/Database/MongoJustificationTest.php
          php -l tests/Integration/Database/MongoTransactionTest.php
          php -l bin/init_mongodb.php
          php -l bin/create_initial_admin_mongodb.php
          php -l bin/healthcheck_mongodb.php
          php -l tests/Integration/Database/MongoSchemaTest.php
          php -l tests/Integration/Database/MongoAdminHealthTest.php
          php -l tests/Integration/Database/MongoUserAuthenticatorTest.php
          php -l tests/Integration/Database/MongoOperationLogWriterTest.php
          php -l src/Push/WebPush.php
          php -l src/Database/MongoPushSubscriptions.php
          php -l src/Database/MongoPushQueue.php
          php -l bin/process_push_queue_mongodb.php
          php -l bin/generate_vapid_keys.php
          php -l templates/push_panel.php
          php -l templates/push_activate.php
          php -l templates/push_home.php
          php -l templates/push_invite.php
          php -l tests/Integration/Database/MongoPushTest.php
          php -l tests/Integration/push_web.php
          php -l tests/Integration/push_service_stub.php
          php -l src/Database/MongoAbsenceNotice.php
          php -l src/Database/MongoOccurrences.php
          php -l templates/occurrences.php
          php -l templates/absence_detail.php
          php -l tests/Integration/Database/MongoOccurrencesTest.php
          php -l tests/Integration/web_client.php
          php -l tests/Integration/occurrences_web.php
      - name: Validate Web Push encryption (RFC 8291), VAPID and endpoint allowlist
        run: php tests/Unit/Push/WebPushTest.php
      - name: Validate Web Push HTTP delivery to a local push service
        run: php tests/Unit/Push/WebPushDeliveryTest.php
      - name: Validate schema, indexes and idempotent bootstrap
        run: php tests/Integration/Database/MongoSchemaTest.php
      - name: Validate isolated SQLite historical import and quarantine
        run: php tests/Integration/Database/SQLiteImporterTest.php
      - name: Validate initial administrator and readiness check
        run: php tests/Integration/Database/MongoAdminHealthTest.php
      - name: Validate isolated MongoDB authentication
        run: php tests/Integration/Database/MongoUserAuthenticatorTest.php
      - name: Validate append-only MongoDB audit logging
        run: php tests/Integration/Database/MongoOperationLogWriterTest.php
      - name: Validate transaction commit and rollback
        run: php tests/Integration/Database/MongoTransactionTest.php
      - name: Validate login and staff registration over HTTP
        env:
          SAA_WEB_MODE: mongo_staff
          SAA_MONGO_ATTENDANCE_PREVIEW: "true"
          MAIL_MODE: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: "1025"
          SMTP_ENCRYPTION: none
          PUBLIC_BASE_URL: http://127.0.0.1:8765
          MONGODB_DB: saa_web_ci
          INITIAL_ADMIN_NAME: Coordenação
          INITIAL_ADMIN_EMAIL: coord@example.org
          INITIAL_ADMIN_PASSWORD: CI-temporaria-2026
        run: |
          php bin/init_mongodb.php
          php bin/create_initial_admin_mongodb.php
          php -S 127.0.0.1:8765 router.php > /tmp/saa-web-ci.log 2>&1 &
          trap 'kill $!' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/login > /dev/null
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8025/api/v1/messages > /dev/null
          python3 tests/Integration/staff_web.py
          php -r 'require "vendor/autoload.php"; $db=Saa\Database\Mongo::database(); exit($db->attendance_sessions->countDocuments()===1 && $db->absences->countDocuments()===1 && $db->mail_queue->countDocuments(["status"=>"AGUARDANDO"])===1 ? 0 : 1);'
          php bin/process_mail_queue_mongodb.php
          python3 tests/Integration/mongo_email.py
          php -r 'require "vendor/autoload.php"; $db=Saa\Database\Mongo::database(); exit($db->absences->countDocuments(["status"=>"RESPONDIDA"])===1 && $db->justifications->countDocuments(["reason"=>"DOENCA"])===1 && $db->communications->countDocuments(["status"=>"ENVIADO"])===1 && $db->mail_queue->countDocuments(["status"=>"CONCLUIDO","body"=>""])===1 ? 0 : 1);'
          php -r 'require "vendor/autoload.php"; $db=Saa\Database\Mongo::database(); $u=$db->users->findOne(["email"=>"aoe@example.org"]); $a=$db->users->findOne(["email"=>"coord@example.org"]); exit($u && $a && $db->operation_logs->countDocuments(["action"=>"USUARIO_CRIADO","user_id"=>$a["_id"],"entity_id"=>(string)$u["_id"]])===1 && !$db->users->findOne(["email"=>"denied@example.org"]) ? 0 : 1);'
      - name: Validate MongoDB school directory
        run: php tests/Integration/Database/MongoSchoolDirectoryTest.php
      - name: Validate transactional attendance and mail outbox
        run: php tests/Integration/Database/MongoAttendanceTest.php
      - name: Validate MongoDB mail lease and retry
        run: php tests/Integration/Database/MongoMailQueueTest.php
      - name: Validate guardian link and single justification
        run: php tests/Integration/Database/MongoJustificationTest.php
      - name: Validate push invites, routing, retry and e-mail fallback
        run: php tests/Integration/Database/MongoPushTest.php
      - name: Validate occurrences, absence detail and communication retry
        run: php tests/Integration/Database/MongoOccurrencesTest.php
      - name: Validate push notification and occurrences flows over HTTP
        env:
          SAA_WEB_MODE: mongo_staff
          SAA_MONGO_ATTENDANCE_PREVIEW: "true"
          PUBLIC_BASE_URL: http://127.0.0.1:8767
          MONGODB_DB: saa_push_web_ci
          INITIAL_ADMIN_NAME: Coordenação
          INITIAL_ADMIN_EMAIL: coord@example.org
          INITIAL_ADMIN_PASSWORD: CI-temporaria-2026
          VAPID_SUBJECT: mailto:ci@example.org
          PUSH_STUB_URL: http://127.0.0.1:8766
          PUSH_ALLOWED_ENDPOINT_PREFIXES: http://127.0.0.1:8766/push/
        run: |
          export PUSH_STUB_DIR="$(mktemp -d)"
          eval "$(php bin/generate_vapid_keys.php 2>/dev/null | grep '^VAPID_P' | sed 's/^/export /')"
          php bin/init_mongodb.php
          php bin/create_initial_admin_mongodb.php
          php -S 127.0.0.1:8767 router.php > /tmp/saa-push-web.log 2>&1 &
          WEB=$!
          php -S 127.0.0.1:8766 tests/Integration/push_service_stub.php > /tmp/saa-push-stub.log 2>&1 &
          STUB=$!
          trap 'kill $WEB $STUB' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8767/login > /dev/null
          php tests/Integration/push_web.php
          php tests/Integration/occurrences_web.php
      - name: Stop MongoDB replica set
        if: always()
        run: docker rm -f saa-mongodb || true
