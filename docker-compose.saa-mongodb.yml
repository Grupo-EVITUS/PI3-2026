services:
  mongodb:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval 'try { if (rs.status().myState === 1) quit(0); } catch (e) {}
          try { rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]}); } catch (e) {}
          quit(1)'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
